<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=1240"/>
  <title>Tënkui 2026 — Print</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Serif+Display:ital@0;1&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>

  <style>
    @page { size: A4; margin: 12mm; }
    html, body { background: var(--paper); }
    .print-page { break-after: page; padding-bottom: 24px; }
    .print-page:last-child { break-after: auto; }
    .print-label {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      color: var(--primary);
      text-transform: uppercase;
      padding: 14px 32px 0;
      max-width: 1240px;
      margin: 0 auto;
    }
    .site-header { position: relative !important; }

    @media print {
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      .site-footer { margin-top: 32px; }
      a { text-decoration: none; color: inherit; }
      .btn, .icon-btn { box-shadow: none !important; }
      body { font-size: 13px; }
      .section { padding: 32px 0 !important; }
      .container { max-width: none !important; padding: 0 16px !important; }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="page-home.jsx"></script>
  <script type="text/babel" src="page-programa.jsx"></script>
  <script type="text/babel" src="page-obra.jsx"></script>
  <script type="text/babel" src="page-sedes.jsx"></script>
  <script type="text/babel" src="page-extras.jsx"></script>

  <script type="text/babel">
    const PrintApp = () => {
      const noop = () => {};
      const navigate = noop;
      const openTickets = noop;

      const pages = [
        { label: '01 · Inicio', el: <HomePage navigate={navigate} openTickets={openTickets}/> },
        { label: '02 · Programación', el: <ProgramaPage navigate={navigate}/> },
        { label: '03 · Obra · Pipí la noche', el: <ObraPage id="pipi-la-noche" navigate={navigate} openTickets={openTickets}/> },
        { label: '04 · Obra · Fiesta de tambores', el: <ObraPage id="fiesta-de-tambores" navigate={navigate} openTickets={openTickets}/> },
        { label: '05 · Sedes', el: <SedesPage navigate={navigate}/> },
        { label: '06 · Sede · Casa de los títeres MONINI', el: <SedePage id="casa-titeres-monini" navigate={navigate}/> },
        { label: '07 · El movimiento', el: <MovimientoPage navigate={navigate}/> },
        { label: '08 · Boletos', el: <BoletosPage navigate={navigate}/> },
      ];

      return (
        <div>
          {pages.map((p, i) => (
            <div key={i} className="print-page">
              <div className="print-label">Tënkui 2026 · {p.label}</div>
              {p.el}
            </div>
          ))}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<PrintApp/>);

    // Auto-print after fonts + babel are ready
    (async () => {
      try { await document.fonts.ready; } catch(e) {}
      await new Promise(r => setTimeout(r, 1200));
      window.print();
    })();
  </script>
</body>
</html>
